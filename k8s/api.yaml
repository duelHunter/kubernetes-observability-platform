
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitoring-api
  template:
    metadata:
      labels:
        app: monitoring-api
    spec:
      containers:
        - name: monitoring-api
          image: my-image:v6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000

          envFrom:
            - configMapRef:
                name: monitoring-api-config
            - secretRef:
                name: postgres-secret

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-api
  labels:
    app: monitoring-api
spec:
  type: ClusterIP
  selector:
    app: monitoring-api
  ports:
    - name: http
      port: 80
      targetPort: http
