

apiVersion: apps/v1

kind: Deployment



metadata:

  name: monitoring-api

  labels:

    app: monitoring-api



spec:

  replicas: 2



  selector:

    matchLabels:

      app: monitoring-api



  template:

    metadata:

      labels:

        app: monitoring-api



    spec:

      containers:

        - name: monitoring-api

          image: my-image:v6

          imagePullPolicy: IfNotPresent



          ports:

            - containerPort: 3000
          env:
            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

          envFrom:
            - secretRef:
                name: postgres-secret



          resources:

            requests:

              cpu: "50m"

              memory: "64Mi"

            limits:

              cpu: "200m"

              memory: "128Mi"

